name: Stable Release

# Trigger por push a master (no pull_request:closed): con ese evento GitHub
# resuelve el reusable workflow local (backport.yml) contra el merge-ref del
# PR, que ya no existe despues del merge -> startup_failure (v1.0.0 se
# publico a mano por esto). El push del merge commit no tiene ese problema.
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a releasear (ej: v1.0.1). Vacio: derivar del ultimo merge.'
        required: false
        type: string

# URL del backend a la que apunta el build estable. Configurar el secret
# API_BASE_URL en el repo. Si está vacío, los builds usan los defaults
# locales hardcoded en el código (10.0.2.2:8080 / localhost:8080) — útil
# solo para builds de desarrollo, NO para release público.
env:
  API_BASE_URL: ${{ secrets.API_BASE_URL }}

jobs:
  gate:
    name: Verify release conditions
    # push: solo merges de beta/ o hotfix/ (gitflow: master no recibe otra cosa).
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'beta/') ||
      contains(github.event.head_commit.message, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: Release conditions verified
        run: echo "Merged from release branch — proceeding with stable release"

  build-web:
    name: Build Web
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Build web
        run: |
          ARGS=""
          if [ -n "${API_BASE_URL}" ]; then
            ARGS="--dart-define=API_BASE_URL=${API_BASE_URL}"
            echo "Building with API_BASE_URL=${API_BASE_URL}"
          fi
          flutter build web --release $ARGS

      - name: Zip web build
        run: zip -r smart-warehouse-web.zip build/web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: smart-warehouse-web.zip

  build-android:
    name: Build Android
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Activate melos
        run: dart pub global activate melos

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Build APK
        run: |
          ARGS=""
          if [ -n "${API_BASE_URL}" ]; then
            ARGS="--dart-define=API_BASE_URL=${API_BASE_URL}"
            echo "Building APK with API_BASE_URL=${API_BASE_URL}"
          fi
          flutter build apk --release $ARGS

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  stable-release:
    name: Publish stable release
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive stable version tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            # El merge commit de master dice "... from <owner>/beta/vX.Y.Z"
            VERSION=$(echo "$COMMIT_MSG" | grep -oE '(beta|hotfix)/[^ ]+' | head -1 | cut -d/ -f2-)
            [[ -n "$VERSION" ]] || { echo "ERROR: no pude derivar la version del commit: $COMMIT_MSG" >&2; exit 1; }
            VERSION="${VERSION#v}"
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Stable version: v${VERSION}"

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: .

      - name: Download android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: .

      - name: Create git tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          prerelease: false
          files: |
            smart-warehouse-web.zip
            app-release.apk
          generate_release_notes: true

  trigger-backport:
    name: Trigger backport to develop
    needs: stable-release
    uses: ./.github/workflows/backport.yml
    with:
      version: ${{ needs.stable-release.outputs.version }}
