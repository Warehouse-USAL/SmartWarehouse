name: E2E (Patrol)

# Suite e2e completa contra el backend real dockerizado (E8.3.8, #152).
# Corre nightly y a demanda: el emulador + build integra ~20-30 min,
# prohibitivo para cada PR (decisión registrada en el issue).
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = madrugada en AR; el resultado está antes de empezar el día.
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: Patrol e2e (Android + backend docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # El toolchain se instala ANTES de levantar el backend: docker deja
      # archivos root-owned en wh-backend/data y el hashFiles del cache de
      # flutter-action no puede leerlos (falla el setup).
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activate melos + patrol_cli
        run: |
          dart pub global activate melos
          dart pub global activate patrol_cli 3.11.0

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Warehouse-USAL/wh-backend
          path: wh-backend

      - name: Start backend stack
        working-directory: wh-backend
        env:
          # El seed del backend los toma del entorno (localmente viven en el
          # .env, que no está en el repo). Mismas credenciales que usa la
          # suite (E2eConfig) y el paso "Verify seed".
          ADMIN_EMAIL: admin@smartwarehouse.local
          ADMIN_PASSWORD: changeme
        run: |
          # Los servicios usan bind mounts en ./data y corren con uids propios
          # (redpanda: 101); si docker crea los subdirectorios los deja como
          # root:755 y redpanda muere con 'mkdir failed: Permission denied'.
          # Hay que crearlos ANTES del up, abiertos.
          mkdir -p data/redpanda data/mongodb data/minio
          chmod -R 0777 data
          docker compose up -d --build || {
            echo "::group::docker compose ps"
            docker compose ps -a
            echo "::endgroup::"
            for svc in redpanda backend mongodb minio; do
              echo "::group::logs $svc"
              docker compose logs "$svc" 2>/dev/null | tail -60
              echo "::endgroup::"
            done
            exit 1
          }
          echo "Esperando al backend en :8080..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/swagger-ui.html; then
              echo "Backend arriba."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: el backend no levantó en 5 minutos."
          docker compose ps -a
          docker compose logs redpanda 2>/dev/null | tail -60
          docker compose logs backend 2>/dev/null | tail -60
          exit 1

      - name: Verify seed (admin login)
        run: |
          # El seed corre asíncrono después de que la app abre el puerto:
          # reintentar hasta 2 minutos antes de declarar el seed roto.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@smartwarehouse.local","password":"changeme"}')
            if [ "$code" = "200" ]; then
              echo "Seed OK."
              exit 0
            fi
            echo "login -> $code, reintento $i/24..."
            sleep 5
          done
          echo "ERROR: el login del seed nunca devolvió 200 (ver docs/e2e-data-contract.md)."
          cd wh-backend && docker compose logs backend 2>/dev/null | tail -60
          exit 1

      - name: Seed products with stock
        run: |
          # El DataInitializer del backend solo seedea admin + warehouse; los
          # productos que el contrato e2e garantiza (>= 2 activos en ARS con
          # stock, docs/e2e-data-contract.md) hay que crearlos acá. El stock
          # se asigna vía posiciones del warehouse (PATCH position).
          set -e
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@smartwarehouse.local","password":"changeme"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          auth=(-H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json')
          jqid(){ python3 -c '
          import json,sys
          def find(o):
            if isinstance(o,dict):
              if "id" in o and isinstance(o["id"],str): return o["id"]
              for v in o.values():
                r=find(v)
                if r: return r
            return None
          print(find(json.load(sys.stdin)))'; }
          ZID=$(curl -sf "${auth[@]}" -X POST http://localhost:8080/warehouse/zones \
            -d '{"zone_code":"ZE2E","max_allowed_lines":5}' | jqid)
          LID=$(curl -sf "${auth[@]}" -X POST "http://localhost:8080/warehouse/zones/$ZID/lines" \
            -d '{"number_line":1,"max_allowed_positions":10}' | jqid)
          for i in 1 2 3; do
            PID=$(curl -sf "${auth[@]}" -X POST http://localhost:8080/products \
              -d "{\"sku\":\"SEED-00$i\",\"name\":\"Producto seed $i\",\"category\":\"TECNOLOGIA\",\"price\":{\"amount_cents\":$((i*100000)),\"currency\":\"ARS\",\"tax_included\":true},\"height\":1.0,\"width\":1.0,\"length\":1.0,\"weight\":1.0}" | jqid)
            POSID=$(curl -sf "${auth[@]}" -X POST "http://localhost:8080/warehouse/lines/$LID/positions" \
              -d "{\"position_name\":\"PE2E$i\",\"maximum_capacity\":500,\"size_stock_to_save\":\"GRANDE\"}" | jqid)
            curl -sf "${auth[@]}" -X PATCH "http://localhost:8080/warehouse/positions/$POSID" \
              -d "{\"product_id\":\"$PID\",\"current_stock\":50,\"is_active\":true,\"size_stock_to_save\":\"GRANDE\"}" > /dev/null
            echo "Producto SEED-00$i ($PID) con stock 50."
          done
          count=$(curl -sf "${auth[@]}" "http://localhost:8080/products?page=0&size=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["pagination"]["total_elements"])')
          echo "Productos totales en el catálogo: $count"
          [ "$count" -ge 2 ]

      - name: Run Patrol suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: patrol test --dart-define=E2E_EMAIL=admin@smartwarehouse.local --dart-define=E2E_PASSWORD=changeme --dart-define=SPLASH_MS=0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report
          path: |
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: warn
