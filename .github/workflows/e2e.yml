name: E2E (Patrol)

# Suite e2e completa contra el backend real dockerizado (E8.3.8, #152).
# Corre nightly y a demanda: el emulador + build integra ~20-30 min,
# prohibitivo para cada PR (decisión registrada en el issue).
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = madrugada en AR; el resultado está antes de empezar el día.
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: Patrol e2e (Android + backend docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # El toolchain se instala ANTES de levantar el backend: docker deja
      # archivos root-owned en wh-backend/data y el hashFiles del cache de
      # flutter-action no puede leerlos (falla el setup).
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sin cache: su hashFiles('**/pubspec.lock') barre TODO el workspace
          # y muere con los archivos root-owned que docker deja bajo
          # wh-backend/. El SDK se baja en ~2 min, irrelevante para un nightly.
          cache: false

      - name: Activate melos + patrol_cli
        run: |
          dart pub global activate melos
          dart pub global activate patrol_cli 3.11.0

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Warehouse-USAL/wh-backend
          path: wh-backend

      # Docker Hub dejó de servir minio/minio (pull access denied desde
      # 2026-09-12). Se pre-carga desde quay.io (registry oficial de MinIO) y
      # se taggea con el nombre que espera el compose del backend. Sacar
      # cuando Warehouse-USAL/wh-backend#118 mergee.
      - name: Preload MinIO image from quay.io
        run: |
          docker pull quay.io/minio/minio:latest
          docker tag quay.io/minio/minio:latest minio/minio:latest

      - name: Start backend stack
        working-directory: wh-backend
        env:
          # El seed del backend los toma del entorno (localmente viven en el
          # .env, que no está en el repo). Mismas credenciales que usa la
          # suite (E2eConfig) y el paso "Verify seed".
          ADMIN_EMAIL: admin@smartwarehouse.local
          ADMIN_PASSWORD: changeme
          # Seed oficial del backend (DemoDataSeeder, pedido en wh-backend#111):
          # productos ARS con stock, warehouse, vehículos y órdenes de demo.
          SEED_DEMO: "true"
        run: |
          # Los servicios usan bind mounts en ./data y corren con uids propios
          # (redpanda: 101); si docker crea los subdirectorios los deja como
          # root:755 y redpanda muere con 'mkdir failed: Permission denied'.
          # Hay que crearlos ANTES del up, abiertos.
          mkdir -p data/redpanda data/mongodb data/minio
          chmod -R 0777 data
          docker compose up -d --build || {
            echo "::group::docker compose ps"
            docker compose ps -a
            echo "::endgroup::"
            for svc in redpanda backend mongodb minio; do
              echo "::group::logs $svc"
              docker compose logs "$svc" 2>/dev/null | tail -60
              echo "::endgroup::"
            done
            exit 1
          }
          echo "Esperando al backend en :8080..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/swagger-ui.html; then
              echo "Backend arriba."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: el backend no levantó en 5 minutos."
          docker compose ps -a
          docker compose logs redpanda 2>/dev/null | tail -60
          docker compose logs backend 2>/dev/null | tail -60
          exit 1

      - name: Verify seed (admin login)
        run: |
          # El seed corre asíncrono después de que la app abre el puerto:
          # reintentar hasta 2 minutos antes de declarar el seed roto.
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"email":"admin@smartwarehouse.local","password":"changeme"}')
            if [ "$code" = "200" ]; then
              echo "Seed OK."
              exit 0
            fi
            echo "login -> $code, reintento $i/24..."
            sleep 5
          done
          echo "ERROR: el login del seed nunca devolvió 200 (ver docs/e2e-data-contract.md)."
          cd wh-backend && docker compose logs backend 2>/dev/null | tail -60
          exit 1

      - name: Verify demo seed (products)
        run: |
          # El DemoDataSeeder corre async tras el arranque; el contrato pide
          # >= 2 productos activos con stock (docs/e2e-data-contract.md).
          TOKEN=$(curl -sf -X POST http://localhost:8080/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@smartwarehouse.local","password":"changeme"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          for i in $(seq 1 24); do
            total=$(curl -sf -H "Authorization: Bearer $TOKEN" \
              'http://localhost:8080/products?page=0&size=1' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["pagination"]["total_elements"])' || echo 0)
            if [ "$total" -ge 2 ]; then
              echo "Seed demo OK: $total productos."
              exit 0
            fi
            echo "productos=$total, reintento $i/24..."
            sleep 5
          done
          echo "ERROR: el seed demo no dejó productos (SEED_DEMO no corrió?)."
          cd wh-backend && docker compose logs backend 2>/dev/null | tail -60
          exit 1

      - name: Run Patrol suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 31: los system images de 34 son pesados para los runners
          # hosted (2 cores) y cuelgan/pierden tests de instrumentation.
          api-level: 31
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: patrol test --dart-define=E2E_EMAIL=admin@smartwarehouse.local --dart-define=E2E_PASSWORD=changeme --dart-define=SPLASH_MS=0 || { echo '===== LOGCAT (tail) ====='; adb logcat -d -t 800 | grep -iE 'patrol|flutter|TestRunner|AndroidRuntime|FATAL|Instrumentation' | tail -200; exit 1; }

      # Los post-steps de flutter-action (cache) corren al final y su
      # hashFiles no puede leer los archivos root-owned que docker dejó en
      # wh-backend/data: sin esta limpieza el job termina rojo con la suite
      # verde.
      - name: Cleanup backend data (root-owned)
        if: always()
        run: sudo rm -rf wh-backend/data

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-report
          path: |
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: warn
